name: CI

on:
  push:
    # 只跑**门禁**（约 2 分钟）。feature 分支也跑 —— 门禁便宜，早点知道坏了比晚点知道好。
    branches: [main, 'feat/**']
  pull_request:
  # 手动触发 = 跑**全量验收**（门禁 + 黄金轨迹保真比对）。
  workflow_dispatch:

jobs:
  verify:
    name: typecheck → lint → test → build → 产物校验 → 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium（仅浏览器检查需要）
        run: npx playwright install --with-deps chromium

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 构建单文件产物
        run: npm run build

      - name: 校验单文件产物（静态检查 + 浏览器检查）
        run: node scripts/verify-single-file.mjs

      - name: 冒烟 e2e（开机 → 难度 → 说明 → 开局 → 命中 → 暂停 → 结算 → 回主页）
        run: npm run test:smoke

      - name: 上传失败时的截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: dist/e2e-shots/
          if-no-files-found: warn

  # 黄金轨迹保真比对 —— **手动触发**（workflow_dispatch），不做每次 push 的门禁。
  #
  # 为什么降级：它回答的是「重构前后行为是否逐帧一致」，而重构已经结束了
  # （0.2.0 合进 main）。从今往后它挡的是「我自己改规则层时有没有偷偷改变行为」，
  # 这件事值得盯，但不值得让每次 push 都多付一遍时间。
  # 脚本与 golden trace 都还在，`npm run trace` 本地随时能跑。
  # 决策见 docs/adr/0008-ci-gate-slimmed-to-smoke.md
  trace:
    name: 黄金轨迹保真比对（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium（回放器要驱动旧版 harness）
        run: npx playwright install --with-deps chromium

      - name: Golden trace 保真比对（旧版 harness × 新规则层 逐帧比对）
        run: npm run trace

# ── 这个门禁守什么 / 不守什么 ──────────────────────────────
#
# **门禁（每次 push 都跑，约 2 分钟）**
#   typecheck · lint · 单元测试 · 构建 · 单文件产物校验 · 冒烟 e2e
#   冒烟（`tests/e2e/smoke.mjs`）走一条 30 秒的路径：
#   开机 → 难度屏 → 玩法说明屏 → 开局 → 出刀命中 → 暂停 / 恢复
#        → 结算 → 「选择难度」→ 难度屏 → 回主页面
#
# **本地跑，不进 CI**
#   - `npm run test:e2e` —— 完整 8 步流程 + 与旧版 `source.html` 的并排对照。
#     旧版对照要等两次血量掉光，约 8 分钟。
#   - `npm run test:visual` —— 6 个特效脚本（定点注入拼图 / bloom 开关 /
#     FEVER 描边连续性 / 冲击波像素探针 / 真实对局瞬间 / 键盘长按怪）。
#     判据是**相对 / 结构性**的（亮度比、描边连续性、位移场比值），
#     不是绝对像素阈值 —— 换机器不会飘，但 SwiftShader 软件光栅下整套装机
#     要 3.5–8 分钟，犯不着每次 push 都付。
#   - `npm run trace` —— 黄金轨迹保真比对（CI 里手动触发）。
#
# 说明（ADR-0004）：CI 不做任何性能断言。性能由结构性设计保证，
# 不建立基准测试套件，也不做反复的实机性能测量。
# 无头 Chromium 走 SwiftShader 软件光栅，FPS 挂件只有 11–13 ——
# 那**不是**产品性能指标。
#
# 无头 Chromium 的帧步长被钳在 50ms（`dt = min(dt, 0.05)`），所以在
# SwiftShader 下模拟推进只有实时的约 60%。冒烟因此用 **4★** 开局 ——
# 刷新 ×2.5，血量掉得快，等结算从 46 秒降到 13 秒。
