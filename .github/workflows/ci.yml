name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck → lint → test → build → verify-single-file
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium（仅浏览器检查需要）
        run: npx playwright install --with-deps chromium

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 构建单文件产物
        run: npm run build

      - name: 校验单文件产物（静态检查 + 浏览器检查）
        run: node scripts/verify-single-file.mjs

# 说明（ADR-0004）：CI 不做任何性能断言。性能由结构性设计保证，
# 不建立基准测试套件，也不做反复的实机性能测量。
